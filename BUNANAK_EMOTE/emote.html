<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Selector and Download</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 50px 20px;
  }

  h2 {
    color: #333;
    margin-bottom: 20px;
    font-size: 28px;
  }

  img {
    max-width: 350px;
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  img:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
  }

  select {
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin: 20px 0;
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  select:hover {
    border-color: #888;
  }

  a button {
    background-color: #007BFF;
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  a button:hover {
    background-color: #0056b3;
    transform: scale(1.05);
  }

  /* Responsive */
  @media (max-width: 400px) {
    img {
      max-width: 90%;
    }
    select, a button {
      width: 100%;
    }
  }
</style>
</head>
<body>

<h2>Select an Emote</h2>

<img id="preview" src="https://tinongskie.github.io/bunanak1/Screenshot%202025-10-02%20091659.png" alt="Selected Image">

<select id="imageSelector">
  <option value="https://tinongskie.github.io/bunanak1/Screenshot%202025-10-02%20091659.png" data-download="http://147.185.221.211:43124/s/jaAMkxj2nnnacXq">Apa! AHH</option>
  <option value="https://tinongskie.github.io/bunanak1/Walangjowa.png" data-download="http://147.185.221.211:43124/s/76fxzsDBP6D8SCY">Wala Kang Jowa</option>
  <option value="https://via.placeholder.com/300/00ff00" data-download="https://via.placeholder.com/300.png?text=Download3">Not yet available</option>
  <option value="https://via.placeholder.com/300/0000ff" data-download="https://via.placeholder.com/300.png?text=Download4">Not yet available</option>
</select>

<a id="downloadLink" href="http://147.185.221.211:43124/s/jaAMkxj2nnnacXq" download="image.png">
  <button>Download</button>
</a>
<p>By downloading, you will access @batangnana's private server.</p>
<center>
<h3>!One or more of our nas are failing and cannot send data. Come back again later!</h3>
<script>
  const selector = document.getElementById('imageSelector');
  const preview = document.getElementById('preview');
  const downloadLink = document.getElementById('downloadLink');

  selector.addEventListener('change', function() {
    preview.src = this.value;
    downloadLink.href = this.selectedOptions[0].dataset.download;
  });
</script>

</body>
</html>
